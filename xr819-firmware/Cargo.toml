[package]
name = "xr819-firmware"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Experimental open firmware for the XRadio XR819"

[lib]
crate-type = ["rlib"]

[features]
# Active scan-owned probe TX is now the default firmware behavior. Keep the
# feature name as an explicit rollback boundary while JOIN/VIF work continues;
# `--no-default-features` retains the established passive fallback image.
default = ["probe-tx-experiment", "wsm-cw1200-compat"]
probe-tx-experiment = []
# WSM wire profile selected through the startup label. CW1200 compatibility is
# the production default; native XR819 enables extended TX confirmations and
# native host command semantics for comparison testing.
wsm-cw1200-compat = []
wsm-xr819-native = []
# JOIN and host management TX can be exercised with passive scanning while the
# independent active-probe preparation path is under hardware diagnosis.
join-sta-experiment = []
# Bounded ordinary class-0 candidate: one outstanding non-aggregate frame with
# retained HIF ownership, software CCMP, vendor pending/PAS scheduling, MAC
# publication/retry/completion, confirmation, and host-pool return.
vendor-host-tx-foundation = ["join-sta-experiment"]
# Non-destructive retained stage/frame/HIF snapshots for host TX bring-up.
# Production station images keep the lifecycle but compile these writers out.
vendor-host-tx-diagnostics = ["vendor-host-tx-foundation"]
# Retire the hardware TX ring cursor (`ring + 0x20` bits 26:24 and 29:27) to the
# software producer when a burst completes, as vendor `txp_pipe_advance_slot`
# (`0xa9f2`) does. Without it the two cursors diverge after the first completion
# and the packet controller re-executes a stale slot's command list.
pipe-cursor-resync = []
# Diagnostic: halt and publish the full pipe/ring context the first time the
# vendor `txp_fn_4425` cursor invariant breaks. The counters MIB stops answering
# once the pipe wedges, so the report must be made at the transition itself.
pipe-cursor-assert = ["vendor-host-tx-diagnostics"]
# Retire a started slot whose delivered MAC status never equals its expected
# completion, once the hardware ring cursor has moved past it. Without this a
# single unmatched status (the MAC reports 0x0f where 0x11 is expected) pins the
# pipe armed forever and the controller re-executes a stale command list.
unmatched-tx-status-recovery = []
# Drop the invented `0x040099a9` 5 -> 3 normalisation in
# `advance_awake_station_tx`. Vendor `phy_state_advance` (`0x820a`) never writes
# that byte, and a hardware capture shows the accepted class-6 publication runs
# with retained state 5 while the refused class-0 one had been forced to 3.
phy-advance-vendor-exact = []
# Diagnostic: halt and publish the assembled class-0 command list immediately
# after GO, so the descriptor the MAC refuses can be compared word-for-word
# against vendor `txp_submit_to_pipe` (`0xadd0`).
class0-descriptor-dump = ["vendor-host-tx-diagnostics"]
# Report class-0 lifecycle counters through the counters MIB instead of the TX
# identity snapshot. Counts of state transitions are stable run to run, unlike
# throughput, which spans 36-95 TXed for byte-identical firmware.
class0-lifecycle-counters = ["vendor-host-tx-diagnostics"]
# Diagnostic: halt and report the HIF output accounting once the output path has
# been blocked for three seconds. Indications and host requests both need a free
# shared slot, so they stop together under load; the emergency descriptor does
# not need one and still delivers the report.
hif-stall-dump = ["vendor-host-tx-diagnostics"]
# Diagnostic: halt and report the class-0 lifecycle counters half a second after
# the first class-0 publication. The counters MIB cannot answer what happens to
# a data frame, because it is readable only before any data frame exists: the
# first published frame the MAC refuses disables the host command lane.
class0-first-frame-dump = ["class0-lifecycle-counters"]
# Move the class0-first-frame-dump window to 20s, landing inside the flood where
# the path has wedged. The first frames succeed, so the short window only ever
# shows a healthy funnel.
class0-late-frame-dump = ["class0-first-frame-dump"]
# Port of vendor FUN_00003bac, the 200ms timer that decrements each programmed
# pipe watchdog byte (pipe_state +0xa5) and recovers a pipe left armed without
# completing. Ghidra never made a function of it; it was recovered by
# disassembly. Its absence makes a wedged pipe unrecoverable, because retirement
# only runs from a delivered status and a wedged pipe stops receiving them.
# Report-only mode for the RX/TX boundary detectors. They halt the firmware on
# the first sign of corruption, so no run has ever observed whether the system
# keeps working through it. Counts RX resynchronisations instead of halting.
corruption-non-fatal = ["vendor-host-tx-diagnostics"]
pipe-watchdog = ["vendor-host-tx-diagnostics", "unmatched-tx-status-recovery"]
# Retire only slots whose frame actually started transmitting. A TX status is
# matched against the pipe's current slot rather than the slot it was generated
# for, so under load a status for a finished frame lands on the freshly
# published frame behind it and retires a frame that never transmitted. All 297
# retirements in an iperf run were such state-1 slots, ~10% of published frames.
# Requires pipe-watchdog: genuinely stuck state-1 slots are then recovered by
# vendor's own 200 ms watchdog instead.
retire-started-only = ["pipe-watchdog"]
# Destructive diagnostic: preserve encrypted payload/MIC but clear the 802.11
# Protected bit on non-EAPOL data immediately before MAC publication.
clear-protected-data-diagnostic = []
# Destructive diagnostic: remove reserved CCMP header/MIC space and publish a
# compact plaintext non-EAPOL data frame.
plaintext-data-diagnostic = []
# Diagnostic: route every host WSM frame through AC/pipe 0. EAPOL and internal
# management already use this working path; ordinary BE traffic normally uses
# pipe 2, where activation currently stalls.
host-pipe0-diagnostic = []
# Destructive diagnostic: remove the QoS-control field from host QoS-data
# frames and publish them as ordinary data. This distinguishes the post-WPA
# QoS frame shape from the non-QoS control-port/EAPOL path.
non-qos-data-diagnostic = []
# Destructive diagnostic: strip the CCMP reservation from ordinary data, then
# publish it through the exact management/EAPOL context-preparation path. This
# isolates all data-specific context metadata from the resulting frame bytes.
legacy-data-publication-diagnostic = []
# Diagnostic: move ordinary plaintext data onto a real context from the
# vendor 30-entry WSM pool and use completion class 0, while retaining the
# proven direct single-frame hardware publisher.
host-class0-direct-diagnostic = []
# Refines host-class0-direct by using vendor host WSM link slot 0 rather than
# retaining the internal management path's compatibility link slot 1.
host-class0-link0-direct-diagnostic = ["host-class0-direct-diagnostic"]
# Diagnostic: apply the two data-frame mutations made after vendor queueing and
# immediately before descriptor construction: crypto-complete ownership bit 5
# and scheduler-selected frame-node bit 26.
scheduler-data-flags-diagnostic = []
# Reproduce tx_frame_done_release -> pas_retime_and_kick ownership bit 0x40
# before direct publication, without yet enqueueing the PAS global ring.
vendor-ready-frame-flag-diagnostic = []
# Reproduce the complete pending-list -> task removal -> PAS global-ring
# handoff before retaining the existing direct descriptor publisher.
vendor-queue-handoff-diagnostic = []
# Diagnostic: ordinary joined data bypasses the probe-only PHY operation/timer
# setup before pipe publication. The vendor host scheduler does not run that
# active-probe transition for every data frame.
joined-data-no-phy-start-diagnostic = []
# Destructive diagnostic: retain the last visible working EAPOL TX request and
# replay its frame bytes when the host later submits ordinary data. Success or
# failure then isolates frame bytes from post-WPA MAC/scheduler state.
replay-eapol-on-data-diagnostic = []
# Replay exact retained EAPOL bytes/metadata for an ordinary data request, but
# force them through ordinary-data preparation instead of the legacy path.
replay-eapol-through-data-path-diagnostic = []
# Destructive diagnostic: keep plaintext ARP/data frame bytes, but publish them
# through the control-frame path with the exact metadata retained from the last
# successful EAPOL request. This separates request metadata from frame shape.
legacy-data-eapol-metadata-diagnostic = []
# Destructive diagnostic: keep plaintext ARP bytes and original ARP metadata,
# but force the retained successful EAPOL maximum TX rate only.
legacy-data-eapol-rate-diagnostic = []
# Destructive diagnostic: plaintext ARP bytes with exact retained EAPOL WSM
# metadata and total frame length, zero-padding the ARP tail as needed.
legacy-data-eapol-length-diagnostic = []
# Diagnostic/workaround: pad protected data MSDUs before CCMP so the complete
# encrypted 802.11 frame is at least 147 bytes, the measured completion floor.
pad-protected-data-min-length-diagnostic = []
# Destructive diagnostic: strip CCMP, then zero-pad plaintext ordinary data to
# the measured 147-byte completion floor while retaining the ordinary path.
pad-plaintext-data-min-length-diagnostic = ["plaintext-data-diagnostic"]
# Destructive diagnostic: after CCMP and optional Protected-bit clearing, zero
# all bytes after the 802.11 header to test whether payload contents affect MAC.
zero-data-body-diagnostic = []
# Destructive diagnostic: execute CCMP, then strip its reservation again and
# canonicalize the resulting frame to the known-good padded plaintext shape.
strip-encrypted-data-diagnostic = []
# Destructive diagnostic: publish a padded plaintext ordinary-data body under
# the exact MAC header retained from the last successful EAPOL request.
data-eapol-header-diagnostic = ["pad-plaintext-data-min-length-diagnostic"]
tcm-size-diagnostic = []

[[bin]]
name = "mailbox"
path = "src/bin/mailbox.rs"
test = false
bench = false

[[bin]]
name = "download-boot"
path = "src/bin/download_boot.rs"
test = false
bench = false

[[bin]]
name = "download-boot-low"
path = "src/bin/download_boot_low.rs"
test = false
bench = false

[[bin]]
name = "download-boot-sectioned"
path = "src/bin/download_boot_sectioned.rs"
test = false
bench = false

[[bin]]
name = "main-mailbox"
path = "src/bin/main_mailbox.rs"
test = false
bench = false

[[bin]]
name = "hif-startup"
path = "src/bin/hif_startup.rs"
test = false
bench = false

[[bin]]
name = "hif-extension-probe"
path = "src/bin/hif_extension_probe.rs"
test = false
bench = false

[[bin]]
name = "tx_trace_extract"
path = "src/bin/tx_trace_extract.rs"
test = false
bench = false

[dependencies]
aes = { version = "0.8.4", default-features = false }
ccm = { version = "0.5.0", default-features = false }
tock-registers = "0.10.1"
zerocopy = { version = "0.8", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
