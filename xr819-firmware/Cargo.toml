[package]
name = "xr819-firmware"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Experimental open firmware for the XRadio XR819"

[lib]
crate-type = ["rlib"]

[features]
default = []
# Optional bring-up recorder and snapshots. Normal firmware has no features.
vendor-host-tx-diagnostics = []
# Hardware-only depth-two A-MPDU bring-up. Never enabled in normal firmware.
experimental-depth-two-ampdu = []
# Captures the initialized DTCM image at three startup checkpoints and exposes
# it through private paginated read-MIB diagnostics.
dtcm-contract-diagnostics = []
# Hardware-only proof that translated startup no longer depends on selected
# retained initialized-image ranges. Never enabled in normal firmware.
experimental-zero-initialized-dtcm = []

[[bin]]
name = "mailbox"
path = "src/bin/mailbox.rs"
test = false
bench = false

[[bin]]
name = "download-boot"
path = "src/bin/download_boot.rs"
test = false
bench = false

[[bin]]
name = "download-boot-low"
path = "src/bin/download_boot_low.rs"
test = false
bench = false

[[bin]]
name = "download-boot-sectioned"
path = "src/bin/download_boot_sectioned.rs"
test = false
bench = false

[[bin]]
name = "main-mailbox"
path = "src/bin/main_mailbox.rs"
test = false
bench = false

[[bin]]
name = "hif-startup"
path = "src/bin/hif_startup.rs"
test = false
bench = false

[[bin]]
name = "hif-extension-probe"
path = "src/bin/hif_extension_probe.rs"
test = false
bench = false

[[bin]]
name = "tx_trace_extract"
path = "src/bin/tx_trace_extract.rs"
test = false
bench = false

[dependencies]
aes = { version = "0.8.4", default-features = false }
ccm = { version = "0.5.0", default-features = false }
tock-registers = "0.10.1"
zerocopy = { version = "0.8", features = ["derive"] }

[build-dependencies]
aes = "0.8.4"
ccm = "0.5.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
