[package]
name = "xr819-firmware"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Experimental open firmware for the XRadio XR819"

[lib]
crate-type = ["rlib"]

[features]
default = []
# Optional bring-up recorder and snapshots. Normal firmware has no features.
vendor-host-tx-diagnostics = []
# Hardware-only depth-two A-MPDU bring-up. Never enabled in normal firmware.
experimental-depth-two-ampdu = []
# Vendor-order depth-two discriminator: form and detach the complete PAS list
# before claiming the aggregate's single physical pipe slot.
experimental-list-first-ampdu = ["experimental-depth-two-ampdu"]
# Scale the proven list-first transaction to four members sharing one slot.
experimental-list-first-depth-four-ampdu = [
    "experimental-list-first-ampdu",
    "experimental-depth-four-ampdu",
]
# Exactly-five one-slot discriminator with one completion identity spilled into
# an otherwise-empty pipe registry slice. This intentionally excludes the
# shared-rate and deeper-retry feature graph.
experimental-list-first-depth-five-ampdu = [
    "experimental-list-first-depth-four-ampdu",
]
# Exactly-eight one-slot discriminator. Four identities occupy the aggregate
# pipe slice and four occupy one otherwise-empty foreign slice.
experimental-list-first-depth-eight-ampdu = [
    "experimental-list-first-depth-five-ampdu",
]
# Hardware-only depth-three/four A-MPDU bring-up. This keeps the qualified
# depth-two retry implementation byte-stable while deeper ownership evolves.
experimental-depth-four-ampdu = [
    "experimental-depth-two-ampdu",
    "experimental-four-slot-ordinary",
]
# Extends the software aggregate plan and BA bookkeeping to eight members.
# Hardware publication must still use the four-slot pipe as one aggregate owner.
experimental-depth-eight-ampdu = [
    "experimental-depth-four-ampdu",
    "experimental-shared-ampdu-rate",
]
# Replaces the depth histogram with packed retry-outcome telemetry in the
# diagnostic counters MIB. Never enabled in normal firmware.
experimental-ampdu-outcome-telemetry = ["experimental-depth-four-ampdu"]
# Bounded precursor to PAS-ring member requeue: allow deeper aggregate members
# outside the received BA bitmap window to consume their host retry policy.
experimental-outside-window-retry = ["experimental-depth-four-ampdu"]
# Retires partial aggregates and returns retryable members to normal PAS
# scheduling instead of rebuilding the original MAC slot in place.
experimental-member-requeue = ["experimental-outside-window-retry"]
# Reuses four low-value outcome bytes to compare raw per-rate failure nibbles
# with the aggregate failure count returned in each host confirmation.
experimental-rate-feedback-telemetry = [
    "experimental-member-requeue",
    "experimental-ampdu-outcome-telemetry",
]
# Marks one confirmed member with aggregate length and acknowledged-member count
# so mac80211 consumes rate feedback once per physical A-MPDU.
experimental-aggregate-rate-feedback = ["experimental-member-requeue"]
# Aggregate same-link/TID candidates at the head policy's physical rate even
# when minstrel requested different initial rates for later members.
experimental-shared-ampdu-rate = ["experimental-aggregate-rate-feedback"]
# Reuses the first outcome bytes to census candidate, BA-session, and planned
# aggregate gates while aggregate-level rate feedback is brought up.
experimental-aggregate-grouping-telemetry = [
    "experimental-shared-ampdu-rate",
    "experimental-ampdu-outcome-telemetry",
]
# Coalesces ready TX confirmations and removes avoidable idle-pipe fill waits.
experimental-fast-loop = []
# Records joined RX FIFO pressure and publication blockers in counters MIB words
# 11 through 19 without changing the normal receive path.
experimental-rx-path-diagnostics = []
# Board-local discriminator: replace dynamic-IQ search output with the stable
# channel-6 correction pair observed under vendor firmware.
experimental-fixed-iq-correction = []
# Board-local discriminator: retain the dynamic first pair and replace only the
# stage-six-derived second correction pair with the vendor channel-6 value.
experimental-fixed-iq-second-pair = []
# Records first/final-pass dynamic-IQ controls, candidates, and correlations in
# the unused tail of the RX FIFO backing allocation for hardware comparison.
experimental-dynamic-iq-trace = []
# Hardware-only vendor-depth ordinary batch bring-up. Normal firmware remains
# capped at the previously qualified two-slot transaction.
experimental-four-slot-ordinary = []
# Captures the initialized DTCM image at three startup checkpoints and exposes
# it through private paginated read-MIB diagnostics.
dtcm-contract-diagnostics = []

[[bin]]
name = "mailbox"
path = "src/bin/mailbox.rs"
test = false
bench = false

[[bin]]
name = "download-boot"
path = "src/bin/download_boot.rs"
test = false
bench = false

[[bin]]
name = "download-boot-low"
path = "src/bin/download_boot_low.rs"
test = false
bench = false

[[bin]]
name = "download-boot-sectioned"
path = "src/bin/download_boot_sectioned.rs"
test = false
bench = false

[[bin]]
name = "main-mailbox"
path = "src/bin/main_mailbox.rs"
test = false
bench = false

[[bin]]
name = "hif-startup"
path = "src/bin/hif_startup.rs"
test = false
bench = false

[[bin]]
name = "hif-extension-probe"
path = "src/bin/hif_extension_probe.rs"
test = false
bench = false

[[bin]]
name = "tx_trace_extract"
path = "src/bin/tx_trace_extract.rs"
test = false
bench = false

[dependencies]
aes = { version = "0.8.4", default-features = false }
ccm = { version = "0.5.0", default-features = false }
tock-registers = "0.10.1"
zerocopy = { version = "0.8", features = ["derive"] }

[build-dependencies]
aes = "0.8.4"
ccm = "0.5.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
